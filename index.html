<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمل ألمانية قصيرة</title>

<!-- ResponsiveVoice -->
<script src="https://code.responsivevoice.org/responsivevoice.js"></script>

<style>
body{
    font-family: Tahoma, Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}
.container{
    background:#fff;
    border-radius:15px;
    padding:20px;
    max-width:900px;
    margin:auto;
}
h1{text-align:center;color:#667eea}
.card{
    background:#f7f7f7;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    position:relative;
    cursor:pointer;
}
.german{
    font-size:22px;
    color:#667eea;
    direction:ltr;
}
.arabic{
    font-size:18px;
    margin-top:5px;
}
.speak{
    position:absolute;
    right:10px;
    top:10px;
    border:none;
    background:#667eea;
    color:#fff;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
}
.speak.speaking{
    background:#10b981;
}
</style>
</head>

<body>

<div class="container">
<h1>🗣️ جمل ألمانية قصيرة</h1>

<div class="card" onclick="speakText('Wie viel kostet das?', this)">
    <button class="speak">🔊</button>
    <div class="german">Wie viel kostet das?</div>
    <div class="arabic">كم سعر هذا؟</div>
</div>

<div class="card" onclick="speakText('Ich brauche eine Tüte.', this)">
    <button class="speak">🔊</button>
    <div class="german">Ich brauche eine Tüte.</div>
    <div class="arabic">أحتاج كيسًا</div>
</div>

<div class="card" onclick="speakText('Wo ist der Bahnhof?', this)">
    <button class="speak">🔊</button>
    <div class="german">Wo ist der Bahnhof?</div>
    <div class="arabic">أين المحطة؟</div>
</div>

</div>

<script>
let currentBtn = null;

function speakText(text, card){
    const btn = card.querySelector('.speak');

    if(currentBtn){
        currentBtn.classList.remove('speaking');
    }
    btn.classList.add('speaking');
    currentBtn = btn;

    // 1️⃣ محاولة ResponsiveVoice
    try{
        if(typeof responsiveVoice !== "undefined"){
            responsiveVoice.cancel();
            responsiveVoice.speak(text,"Deutsch Female",{
                rate:0.8,
                onend: ()=> btn.classList.remove('speaking'),
                onerror: ()=> webSpeech(text,btn)
            });
            return;
        }
    }catch(e){
        console.log("ResponsiveVoice failed",e);
    }

    // 2️⃣ البديل الآمن
    webSpeech(text,btn);
}

function webSpeech(text,btn){
    if(!window.speechSynthesis){
        alert("النطق غير مدعوم في هذا المتصفح");
        btn.classList.remove('speaking');
        return;
    }

    const synth = window.speechSynthesis;
    synth.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    const deVoice = voices.find(v => v.lang.startsWith("de"));
    if(deVoice) utter.voice = deVoice;

    utter.rate = 0.9;
    utter.onend = ()=> btn.classList.remove('speaking');
    utter.onerror = ()=> btn.classList.remove('speaking');

    synth.speak(utter);
}
</script>

</body>
</html>
